<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ramię SO-101</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115;
    --panel: #171a21;
    --accent: #4f9dff;
    --ok: #35c759;
    --bad: #ff453a;
    --warn: #ffb340;
    --text: #e6e8eb;
    --muted: #8a8f98;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 120px;
    min-height: 100vh;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 16px; color: var(--muted); }
  .panel {
    background: var(--panel);
    border-radius: 12px;
    padding: 16px;
    width: 100%;
    max-width: 520px;
    margin-bottom: 16px;
  }
  .panel-title { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 12px; }
  .status-row { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 4px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); flex-shrink: 0; }
  .dot.on { background: var(--ok); }
  .dot.busy { background: var(--warn); }
  .error { color: var(--bad); font-size: 12px; margin-top: 4px; min-height: 1em; word-break: break-word; }
  .muted { color: var(--muted); font-size: 12px; }
  button {
    font: inherit; color: var(--text); background: #22262f;
    border: 1px solid #2c313c; border-radius: 8px; cursor: pointer;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  button:active { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: 0.35; cursor: default; }
  .steps { display: flex; gap: 8px; }
  .steps button { flex: 1; padding: 10px; font-weight: 600; }
  .steps button.sel { background: var(--accent); border-color: var(--accent); color: #fff; }
  .joint { display: grid; grid-template-columns: 52px 1fr 52px; gap: 8px; align-items: center; margin-bottom: 10px; }
  .joint button { height: 52px; font-size: 24px; font-weight: 700; }
  .jinfo { min-width: 0; }
  .jname { font-size: 13px; display: flex; justify-content: space-between; gap: 6px; }
  .jval { font-variant-numeric: tabular-nums; font-weight: 600; }
  .track { height: 8px; background: #22262f; border-radius: 4px; position: relative; margin: 6px 0 3px; }
  .mark { position: absolute; top: -3px; width: 3px; height: 14px; border-radius: 2px; transform: translateX(-1px); }
  .mark.pos { background: var(--ok); }
  .mark.set { background: var(--accent); opacity: 0.7; }
  .jlim { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row button { flex: 1; padding: 12px; font-weight: 600; min-width: 110px; }
  .motions button { flex: 1 1 45%; }
  .stop-bar {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px;
    background: linear-gradient(transparent, var(--bg) 30%);
    display: flex; justify-content: center;
  }
  .stop-btn {
    width: 100%; max-width: 520px; padding: 18px; font-size: 20px; font-weight: 800;
    background: var(--bad); border-color: var(--bad); color: #fff;
  }
  .stop-btn:active { background: #c7322a; border-color: #c7322a; }
</style>
</head>
<body>
  <h1>Ramię SO-101 - sterowanie ręczne</h1>

  <div class="panel">
    <div class="status-row"><span class="dot" id="dot"></span><span id="status">łączę z serwerem...</span></div>
    <div class="muted" id="result"></div>
    <div class="error" id="error"></div>
  </div>

  <div class="panel">
    <div class="panel-title">KROK (stopnie, chwytak: jednostki 0-100)</div>
    <div class="steps" id="steps"></div>
  </div>

  <div class="panel">
    <div class="panel-title">STAWY <span class="muted">(zielony = odczyt z serw, niebieski = ostatnia komenda)</span></div>
    <div id="joints"></div>
  </div>

  <div class="panel">
    <div class="panel-title">POZYCJE</div>
    <div class="row">
      <button id="home" data-always="1">HOME</button>
      <button id="open">Otwórz chwytak</button>
      <button id="close">Zamknij chwytak</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">RUCHY Z motions/</div>
    <div class="row motions" id="motions"></div>
  </div>

  <div class="stop-bar"><button class="stop-btn" id="stop" data-always="1">STOP (spacja)</button></div>

<script>
  const $ = (id) => document.getElementById(id);
  let step = 5;
  let homed = false;
  let built = false;
  let motionsKey = "";
  let lastErrorShown = "";

  async function send(cmd) {
    try {
      const r = await fetch("/api/cmd", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(cmd),
      });
      const j = await r.json();
      if (!j.ok) showError("Odrzucone: " + j.msg);
    } catch (e) {
      showError("Brak połączenia z serwerem");
    }
  }

  function showError(msg) {
    lastErrorShown = msg;
    $("error").textContent = msg;
  }

  function buildSteps(steps) {
    const box = $("steps");
    box.textContent = "";
    for (const s of steps) {
      const b = document.createElement("button");
      b.textContent = s;
      b.dataset.step = s;
      b.dataset.always = "1";
      if (s === step) b.classList.add("sel");
      b.onclick = () => {
        step = s;
        for (const x of box.children) x.classList.toggle("sel", Number(x.dataset.step) === step);
      };
      box.appendChild(b);
    }
  }

  function buildJoints(joints) {
    const box = $("joints");
    box.textContent = "";
    for (const j of joints) {
      const row = document.createElement("div");
      row.className = "joint";
      row.innerHTML =
        `<button data-j="${j}" data-d="-1">−</button>` +
        `<div class="jinfo">` +
          `<div class="jname"><span>${j}</span><span class="jval" id="v_${j}">-</span></div>` +
          `<div class="track"><span class="mark set" id="s_${j}"></span><span class="mark pos" id="p_${j}"></span></div>` +
          `<div class="jlim"><span id="lo_${j}"></span><span id="hi_${j}"></span></div>` +
        `</div>` +
        `<button data-j="${j}" data-d="1">+</button>`;
      box.appendChild(row);
    }
    box.querySelectorAll("button").forEach((b) => {
      b.onclick = () => send({ cmd: "jog", joint: b.dataset.j, step: Number(b.dataset.d) * step });
    });
  }

  function buildMotions(names) {
    const box = $("motions");
    box.textContent = "";
    for (const n of names) {
      const b = document.createElement("button");
      b.textContent = n;
      b.onclick = () => send({ cmd: "motion", name: n });
      box.appendChild(b);
    }
    if (!names.length) box.innerHTML = '<span class="muted">brak plików w motions/</span>';
  }

  function placeMark(el, v, lo, hi) {
    if (v === undefined || v === null) { el.style.display = "none"; return; }
    el.style.display = "";
    const f = Math.max(0, Math.min(1, (v - lo) / (hi - lo)));
    el.style.left = (f * 100).toFixed(1) + "%";
  }

  function busyText(b) {
    if (!b) return "";
    if (b.cmd === "jog") return `ruch: ${b.joint} ${b.step > 0 ? "+" : ""}${b.step}`;
    if (b.cmd === "motion") return `ruch: ${b.name}`;
    return "ruch: " + b.cmd;
  }

  function render(s) {
    if (!built) {
      buildSteps(s.steps);
      buildJoints(s.joints);
      built = true;
    }
    const key = s.motions.join(",");
    if (key !== motionsKey) { buildMotions(s.motions); motionsKey = key; }

    homed = s.homed;
    const dot = $("dot");
    dot.className = "dot " + (s.busy ? "busy" : "on");
    let st = s.busy ? busyText(s.busy) : "gotowe";
    if (s.queue) st += ` (w kolejce: ${s.queue})`;
    if (!homed) st = (s.busy ? "jadę do HOME..." : "czekam na HOME") + " - inne komendy zablokowane";
    $("status").textContent = st;
    $("result").textContent = s.result || "";
    if (s.error) $("error").textContent = "Błąd: " + s.error;
    else if ($("error").textContent.startsWith("Błąd:")) $("error").textContent = "";

    for (const j of s.joints) {
      const [lo, hi] = s.limits[j];
      const p = s.positions[j];
      const sp = s.setpoint[j];
      $("v_" + j).textContent = p === undefined ? "-" : p.toFixed(1);
      $("lo_" + j).textContent = lo.toFixed(0);
      $("hi_" + j).textContent = hi.toFixed(0);
      placeMark($("p_" + j), p, lo, hi);
      placeMark($("s_" + j), sp, lo, hi);
    }
    document.querySelectorAll("button").forEach((b) => {
      if (!b.dataset.always) b.disabled = !homed;
    });
  }

  async function poll() {
    try {
      const r = await fetch("/api/state", { cache: "no-store" });
      render(await r.json());
      if (lastErrorShown === "Brak połączenia z serwerem") showError("");
    } catch (e) {
      $("dot").className = "dot";
      $("status").textContent = "brak połączenia z serwerem";
    }
    setTimeout(poll, 500);
  }

  $("home").onclick = () => send({ cmd: "home" });
  $("open").onclick = () => send({ cmd: "open" });
  $("close").onclick = () => send({ cmd: "close" });
  $("stop").onclick = () => send({ cmd: "stop" });
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space") { e.preventDefault(); send({ cmd: "stop" }); }
  });
  // spacja na przycisku z fokusem inaczej "kliknelaby" go przy puszczeniu klawisza
  document.addEventListener("keyup", (e) => { if (e.code === "Space") e.preventDefault(); });
  poll();
</script>
</body>
</html>
